spring.application.name=objetos-perdidos-api

# Conexión a PostgreSQL. Por defecto usa la base local (localhost:5432/objetos_perdidos, usuario postgres).
# Para otra base (por ejemplo Azure) define spring_datasource_url y spring_datasource_username:
# jdbc:postgresql://<servidor>.postgres.database.azure.com:5432/objetos_perdidos?sslmode=require
spring.datasource.url=${spring_datasource_url:jdbc:postgresql://localhost:5432/objetos_perdidos}
spring.datasource.username=${spring_datasource_username:postgres}
spring.datasource.password=${spring_datasource_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# "validate" comprueba que las entidades coincidan con las tablas creadas por database/base_datos_proyecto.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Carga de fotografías (F-04: JPG o PNG de máximo 5 MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-swallow-size=10MB

# JWT: el secreto debe tener al menos 32 caracteres. Defínelo como variable de entorno.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiracion=8h

# Carpeta donde se guardan las fotografías (se sirven en /uploads/objetos/...)
app.uploads.directorio=${APP_UPLOADS_DIR:uploads}
app.uploads.tamano-maximo=5MB

# Orígenes del cliente web que pueden llamar a la API (separados por coma)
app.cors.origenes-permitidos=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200}
