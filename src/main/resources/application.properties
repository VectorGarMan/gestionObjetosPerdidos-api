spring.application.name=clinica

# Conexión a PostgreSQL en Azure
spring.datasource.url=${spring_datasource_url}
spring.datasource.username=${spring_datasource_username}
spring.datasource.password=${spring_datasource_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Confiquración de JPA y Hibernate
#"validate" comprueba que las entidades de Java coincidan exactamente con las tablas SQL existentes
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# spring-jpa database-platfornsorg, hibernate, dialect. PostgreSQLDialect